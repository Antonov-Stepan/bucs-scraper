services:
  - type: web
    name: bucs-scraper
    runtime: node
    buildCommand: apt-get update && apt-get install -y chromium-browser || apt-get install -y chromium || true && npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.11.0
