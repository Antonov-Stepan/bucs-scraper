services:
  - type: web
    name: bucs-scraper
    runtime: node
    buildCommand: apt-get install -y chromium && npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium
      - key: NODE_VERSION
        value: 20.11.0
